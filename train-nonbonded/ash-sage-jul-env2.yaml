name: ash-sage-evaluator-2
channels:
  - conda-forge
  - openeye
dependencies:
  - python=3.11
  - pip
  - setuptools

  # chem
  - openeye-toolkits
  - openff-interchange=0.3.29  # forcebalance compatible
  - openff-qcsubmit
  - openff-nagl-base
  - openff-nagl-models
  - openmm=8.2.0
  - openff-bespokefit
  # - forcebalance=1.9.6 

  # data
  - pyarrow

  # yammbs
  - geometric =1
  - qcportal
  - pydantic

  # other
  - seaborn
  - tqdm
  - mdanalysis
  - dask >=2.7.0
  - dask-jobqueue >=0.8.0
  - dask-kubernetes

  - pip:
    - git+https://github.com/openforcefield/openff-toolkit.git@add-nagl-global-v0165
    - git+https://github.com/openforcefield/yammbs.git@main #95126ac
    - git+https://github.com/JHoeflich1/openff-evaluator.git@main
    # - git+https://github.com/openforcefield/openff-evaluator.git@main
    # - git+https://github.com/lilyminium/evaluator-equilibration@main #d9da956
    - git+https://github.com/JHoeflich1/forcebalance.git@sage2.3.0-experiments #49050c7
